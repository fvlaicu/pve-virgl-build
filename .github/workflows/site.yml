# Records the run in the state, writes the status page and, when the site changed (or the live one
# is a day old), assembles it from the state and the Releases and deploys it to Pages. Called by
# virgl-build.yml and rollback.yml after their plan job; no signing key here: the signed files
# come from the state.
name: site

on:
  workflow_call:
    inputs:
      deploy:
        description: 'Deploy even if nothing changed'
        type: boolean
        default: false
      publish-result:
        description: 'The result of the job that published (success, failure, skipped)'
        type: string
        default: ''

permissions:
  contents: read

env:
  VIRGL_STATE: ${{ github.workspace }}/_run/state

jobs:
  site:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    outputs:
      deploy: ${{ steps.site.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: state
          path: _run/state
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: plan
          path: _run/plan
      - id: site
        env:
          GH_TOKEN: ${{ github.token }}
          VIRGL_FORCE_DEPLOY: ${{ inputs.deploy && '1' || '0' }}
          VIRGL_PUBLISH_RESULT: ${{ inputs.publish-result }}
        run: bin/site
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: steps.site.outputs.deploy == '1'
        with:
          path: _run/site/
          include-hidden-files: true
      - name: Commit the state
        if: always()
        run: |
          bin/state-commit "site: run $GITHUB_RUN_ID"

  deploy:
    needs: site
    if: needs.site.outputs.deploy == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
