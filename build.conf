# shellcheck shell=bash
# shellcheck disable=SC2034  # used by the scripts that source this file (through lib/common.sh)
# Settings for the virgl builds. Plain shell assignments, sourced by lib/common.sh and node/opt-in.sh.

# --- what is tracked
TRACK_SUITE=pve-no-subscription      # Proxmox suite whose newest pve-qemu-kvm gets rebuilt
DIST=trixie                          # Debian release of the nodes and of the build containers
ALPINE_BRANCH=3.22                   # guest Mesa base
ALPINE_EOL=2027-05-01                # alpinelinux.org/releases.json
ALPINE_EOL_WARN=2027-03-01           # the status page flags the end of life from this date
PLEX_LIBVA_MINOR=22                  # Plex's libva is 2.22, so it loads drivers exporting __vaDriverInit_1_22 or lower

# --- where it lives
# The GitHub repo: its Releases are the archive. In Actions, GITHUB_REPOSITORY wins.
REPO=fvlaicu/pve-virgl-build
# Where Pages serves the site (the project site of REPO; no custom domain).
# Also the default URL in guest/plex-musl-va-init.sh (make lint checks that they agree); the nodes'
# .sources is written from this by node/opt-in.sh.
PAGES_URL=https://fvlaicu.github.io/pve-virgl-build

# --- publishing
ORIGIN=pve-virgl                     # Origin and Label of the Release file; the nodes' pin matches it
APT_PATH=apt/virgl                   # aptly publish prefix, which is also the URL path under PAGES_URL
STAGING_PREFIX=staging/virgl         # never served; the smoke test reads it from disk
KEEP=5                               # versions per package in the apt repo
KEEP_BUNDLES=3                       # bundles on Pages; older ones stay in their Releases
DEPLOY_MAX_AGE=86400                 # redeploy Pages at least this often (s), so status.json stays fresh
STALE_DAYS=3                         # the nodes' apt check warns when status.json is older than this
GPG_FPR=AFFF15DC7280977F55116839173CB3E3AEB8838D   # signing key fingerprint, printed by bin/make-key
DEBFULLNAME="pve-virgl-build"        # changelog identity for dch: a build identity, not a person
DEBEMAIL=19238716+fvlaicu@users.noreply.github.com   # public: the debs' changelogs and the key's user ID; GitHub's no-reply address

# --- sources
IMAGE_DEBIAN=docker.io/library/debian:$DIST
IMAGE_ALPINE=docker.io/library/alpine:$ALPINE_BRANCH
PROXMOX_KEYRING_URL=https://enterprise.proxmox.com/debian/proxmox-archive-keyring-trixie.gpg
PROXMOX_KEYRING_SHA256=136673be77aba35dcce385b28737689ad64fd785a797e57897589aed08db6e45   # Proxmox wiki
# Alpine's own read-only git host, not GitLab: gitlab.alpinelinux.org has been IP-restricted under load
# (Alpine, 2026-10-21) and didn't answer from here on 2026-10-26/27. Same heads as GitLab's mirrors.
APORTS_URL=https://git.alpinelinux.org/aports
MESA_RECIPE_URL="https://git.alpinelinux.org/aports/plain/main/mesa/APKBUILD?h=$ALPINE_BRANCH-stable"   # check-upstream
ALPINE_DISTFILES=https://distfiles.alpinelinux.org/distfiles/v$ALPINE_BRANCH   # upstream source files of Alpine's packages

# --- the bundle's sources (docs/DESIGN.md, "Licenses")
# Alpine origins whose source goes into each bundle Release as source-<origin>-<version>.tar: the
# copyleft libraries in the bundle. gcc: libstdc++, libgcc. elfutils: libelf. xz: xz-libs, whose
# origin's license field names GPL and LGPL (liblzma itself is 0BSD; the GPL parts are xz's scripts).
# A change to this list rebuilds the bundle.
BUNDLE_SOURCE_ORIGINS="gcc elfutils xz"
# Every other bundle package's license, exactly as Alpine's index has it, reviewed as needing no
# source. bin/verify fails on a package whose origin isn't above and whose license isn't here: a new
# library or a changed license field is looked at before it's published. One per line.
#   zstd-libs is "BSD-3-Clause OR GPL-2.0-or-later": we take BSD-3-Clause.
BUNDLE_LICENSES_NO_SOURCE="
MIT
BSD-3-Clause
X11
Zlib
Apache-2.0
MIT AND SGI-B-2.0 AND BSL-1.0
BSD-3-Clause AND BSD-2-Clause AND ISC AND Beerware AND Public Domain
BSD-3-Clause OR GPL-2.0-or-later
"

# Numbers already used: the hand builds of 2026-10-13..16 and the desktop test of 2026-10-20 (debs
# as "+virgl<N>", Mesa as r100..r102, bundles up to _virgl3), then the local tests and the scratch
# repo's runs of 2026-10-27 (up to qemu virgl2, virglrenderer virgl16, Mesa r104, bundle _virgl9).
# The automation continues the counts, so no number ever names two different builds.
# <product> <base> <highest N used>. Mesa's N is pkgrel - 100.
N_USED="
qemu 11.0.3-4 2
virglrenderer 1.1.0-2 16
mesa 25.1.9 4
bundle plex-vaapi_alpine3.22_mesa25.1.9-r0 9
"
